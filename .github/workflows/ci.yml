name: CI - Run Tests on PR

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic python-dotenv mangum aiofiles boto3

      - name: Run health check test
        run: |
          python -c "from src.api.schemas import RecipeRequest, RecipeResponse; print('Schemas OK')"

      - name: Validate SAM template
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: SAM validate
        run: sam validate --lint
        env:
          AWS_DEFAULT_REGION: ap-south-1
